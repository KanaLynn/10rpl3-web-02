<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Biodata Siswa</title>
  <style>
    :root { --ink: #653843; --muted: #987780; --paper: #fff0ef; --line: #efd1d3; --rose: #c45670; --ivory: #fffaf6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--paper); background-image: radial-gradient(#edc4ca 0.8px, transparent 0.8px); background-size: 18px 18px; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: var(--ink); }
    .container { background-color: var(--ivory); padding: 30px; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px rgba(148, 75, 93, 0.14); width: 100%; max-width: 500px; }
    h2 { color: var(--ink); margin-bottom: 20px; text-align: center; }
    .data-group { margin-bottom: 14px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    .label { font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    .value { font-size: 16px; color: var(--ink); font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; }
    .btn-back { display: block; width: 100%; text-align: center; background-color: var(--rose); color: var(--ivory); border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; margin-top: 20px; transition: background 0.2s, transform 0.2s; }
    .btn-back:hover { background-color: #a9435c; transform: translateY(-1px); }
    .btn-back:focus-visible { outline: 3px solid rgba(196, 86, 112, 0.4); outline-offset: 3px; }
    @media (max-width: 420px) { .container { padding: 22px 18px; } }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hasil Biodata Siswa</h2>
    <div class="data-group">
      <div class="label">Nama Lengkap</div>
      <div class="value" id="resNama">-</div>
    </div>
    <div class="data-group">
      <div class="label">Alamat</div>
      <div class="value" id="resAlamat">-</div>
    </div>
    <div class="data-group">
      <div class="label">Jurusan</div>
      <div class="value" id="resJurusan">-</div>
    </div>
    <div class="data-group">
      <div class="label">Jenis Kelamin</div>
      <div class="value" id="resJk">-</div>
    </div>
    <div class="data-group">
      <div class="label">Tinggi / Berat Badan</div>
      <div class="value" id="resPostur">-</div>
    </div>
    <div class="data-group">
      <div class="label">Hobi</div>
      <div class="value" id="resHobi">-</div>
    </div>
    <div class="data-group">
      <div class="label">No. Handphone</div>
      <div class="value" id="resNohp">-</div>
    </div>
    <a href="form_biodata.html" class="btn-back">Kembali ke Form</a>
  </div>
  <script>
    const dataTersimpan = localStorage.getItem('biodataSiswa');
    if (dataTersimpan) {
      const data = JSON.parse(dataTersimpan);
      document.getElementById('resNama').textContent = data.nama;
      document.getElementById('resAlamat').textContent = data.alamat;
      document.getElementById('resJurusan').textContent = data.jurusan;
      document.getElementById('resJk').textContent = data.jk;
      document.getElementById('resPostur').textContent = `${data.tb} cm / ${data.bb} kg`;
      document.getElementById('resHobi').textContent = data.hobi;
      document.getElementById('resNohp').textContent = data.nohp;
    } else {
      alert('Data tidak ditemukan! Silakan isi form terlebih dahulu.');
    }
  </script>

</body>
</html>
