<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Biodata Siswa</title>
  <style>
    :root {
      --ink: #653843;
      --muted: #987780;
      --paper: #fff0ef;
      --line: #efd1d3;
      --rose: #c45670;
      --soft-pink: #f8dfe1;
      --ivory: #fffaf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--paper); background-image: radial-gradient(#edc4ca 0.8px, transparent 0.8px); background-size: 18px 18px; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: var(--ink); }
    .container { background-color: var(--ivory); padding: 30px; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px rgba(148, 75, 93, 0.14); width: 100%; max-width: 500px; }
    h2 { color: var(--ink); margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-row { display: flex; gap: 16px; }
    .form-row .form-group { flex: 1; min-width: 0; }
    label { display: block; font-weight: 600; font-size: 14px; color: var(--ink); margin-bottom: 6px; }
    input[type="text"], input[type="number"], input[type="tel"], select { width: 100%; padding: 10px 12px; color: var(--ink); background-color: #fffdfb; border: 1.5px solid var(--line); border-radius: 6px; font-size: 14px; outline: none; }
    input::placeholder { color: #b3939a; }
    input:focus, select:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(196, 86, 112, 0.16); }
    input[type="radio"] { accent-color: var(--rose); }
    .radio-group { display: flex; gap: 20px; margin-top: 6px; }
    .radio-option { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-submit { width: 100%; background-color: var(--rose); color: var(--ivory); border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.2s; margin-top: 10px; }
    .btn-submit:hover { background-color: #a9435c; transform: translateY(-1px); }
    .btn-submit:focus-visible { outline: 3px solid rgba(196, 86, 112, 0.4); outline-offset: 3px; }
    @media (max-width: 420px) {
      .container { padding: 22px 18px; }
      .form-row { gap: 10px; }
      .radio-group { gap: 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Form Biodata Siswa</h2>
    <form id="biodataForm">
      <div class="form-group">
        <label for="NLENGKAP">Nama Lengkap</label>
        <input type="text" id="NLENGKAP" name="NLENGKAP" placeholder="Masukkan nama lengkap" required>
      </div>
      <div class="form-group">
        <label for="ALAMAT">Alamat Lengkap</label>
        <input type="text" id="ALAMAT" name="ALAMAT" placeholder="Masukkan alamat tempat tinggal" required>
      </div>
      <div class="form-group">
        <label for="JURUSAN">Jurusan</label>
        <select name="JURUSAN" id="JURUSAN" required>
          <option value="" disabled selected>-- Pilih Jurusan --</option>
          <option value="RPL - Rekayasa Perangkat Lunak">RPL - Rekayasa Perangkat Lunak</option>
          <option value="TEI - Teknik Elektronika Industri">TEI - Teknik Elektronika Industri</option>
          <option value="TKR - Teknik Kendaraan Ringan">TKR - Teknik Kendaraan Ringan</option>
          <option value="TSM - Teknik Sepeda Motor">TSM - Teknik Sepeda Motor</option>
          <option value="TKJ - Teknik Komputer & Jaringan">TKJ - Teknik Komputer & Jaringan</option>    
        </select>
      </div>
      <div class="form-group">
        <label>Jenis Kelamin</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" id="L" name="JENIS_KELAMIN" value="LAKI-LAKI" required>
            Laki-laki
          </label>
          <label class="radio-option">
            <input type="radio" id="P" name="JENIS_KELAMIN" value="PEREMPUAN">
            Perempuan
          </label>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="TB">Tinggi Badan (cm)</label>
          <input type="number" id="TB" name="TB" placeholder="170">
        </div>
        <div class="form-group">
          <label for="BB">Berat Badan (kg)</label>
          <input type="number" id="BB" name="BB" placeholder="60">
        </div>
      </div>
      <div class="form-group">
        <label for="HOBI">Hobi</label>
        <input type="text" id="HOBI" name="HOBI" placeholder="Membaca, Olahraga, dll.">
      </div>
      <div class="form-group">
        <label for="NOHP">No. Handphone (+62)</label>
        <input type="tel" id="NOHP" name="NOHP" placeholder="081234567890">
      </div>
      <button type="submit" class="btn-submit">Simpan & Pindah Halaman</button>
    </form>
  </div>
  <script>
    document.getElementById('biodataForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const jkInput = document.querySelector('input[name="JENIS_KELAMIN"]:checked');
      const dataSiswa = {
        nama: document.getElementById('NLENGKAP').value,
        alamat: document.getElementById('ALAMAT').value,
        jurusan: document.getElementById('JURUSAN').value,
        jk: jkInput ? jkInput.value : '-',
        tb: document.getElementById('TB').value || '-',
        bb: document.getElementById('BB').value || '-',
        hobi: document.getElementById('HOBI').value || '-',
        nohp: document.getElementById('NOHP').value || '-'
      };
      localStorage.setItem('biodataSiswa', JSON.stringify(dataSiswa));
      window.location.href = 'hasil_biodata.html';
    });
  </script>
</body>
</html>>
