<title>Biodata</title>
</head>
<body>
    <form action="hasil_biodata.html" method="GET">
    <label>Nama:</label><br>
    <input type="text" name="nama"><br><br>

    <label>Alamat:</label><br>
    <textarea name="alamat"></textarea><br><br>

    <label>Jurusan:</label><br>
    <select name="jurusan">
        <option value="RPL">RPL</option>
        <option value="TKJ">TKJ</option>
        <option value="TKR">TKR</option>
        <option value="TSM">TSM</option>
        <option value="TEI">TEI</option>
    </select><br><br>

    <label>Jenis Kelamin:</label><br>
    <input type="radio" name="jk" value="perempuan"> perempuan<br>
    <input type="radio" name="jk" value="laki-laki"> laki-laki<br><br>

    <label>Tinggi Badan:</label><br>
    <input type="number" name="tb"><br><br>

    <label>Berat Badan:</label><br>
    <input type="number" name="bb"><br><br>

    <label>Hobi:</label><br>
    <input type="text" name="hobi"><br><br>

    <label>Nomer hp:</label><br>
    <input type="number" name="hp"><br><br>

    <button type="submit">Simpan</button>
